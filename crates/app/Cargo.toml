[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "marine-sim"
path = "src/main.rs"

[dependencies]
sim-core.workspace = true
sim-sensors.workspace = true
protocols.workspace = true
transports.workspace = true
scenario.workspace = true
eframe.workspace = true
egui.workspace = true
walkers.workspace = true
arc-swap.workspace = true
crossbeam-channel.workspace = true
tokio.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
engine.workspace = true
mcp.workspace = true
rfd.workspace = true
dirs.workspace = true
serde.workspace = true
toml.workspace = true
sys-locale.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Names the process, so the app menu reads "Marine Data Simulator" even outside the .app bundle.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
