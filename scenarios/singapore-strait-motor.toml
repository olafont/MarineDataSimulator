# Built-in scenario: a 14 m motor launch running a loop off Singapore's East Coast, beside the
# anchorages and the Singapore Strait traffic lanes, in the northeast monsoon.
# Positions, depths, tide and traffic are illustrative only: NOT for navigation.
name = "Singapore Strait (motor)"

[simulation]
seed = 11

[vessel]
name = "SIM LAUNCH"
mmsi = 100000004
call_sign = "SIM04"
propulsion = "motor"
length_m = 14.0
beam_m = 4.2
draft_m = 1.2
max_speed_kn = 20.0
speed_time_constant_s = 20.0
roll_period_s = 4.0
idle_rpm = 700.0
max_rpm = 2800.0

[initial]
position = { lat = 1.2750, lon = 103.9000 }
heading = 115.0
speed = 12.0
target_speed = 12.0

[steering]
mode = "route"
looped = true
arrival_radius_m = 120.0
waypoints = [
  { lat = 1.2580, lon = 103.9500 },
  { lat = 1.2560, lon = 104.0100 },
  { lat = 1.2700, lon = 104.0500 },
  { lat = 1.2880, lon = 103.9950 },
  { lat = 1.2750, lon = 103.9000 },
]

# Northeast monsoon: steady breeze, warm humid air, short chop.
[environment]
wind_speed = 12.0
wind_direction = 40.0
current_speed = 0.4
current_set = 250.0
seabed_depth = 30.0          # used where there are no soundings
water_temp = 29.5
air_temp = 30.0
pressure = 1009.0
humidity = 80.0
magnetic_variation = 0.2
wave_height = 0.6
wave_period = 4.0
wave_direction = 40.0

[dynamics]
pressure_trend_hpa_h = 0.0

[dynamics.wind]
gust_fraction = 0.10
gust_period_s = 25.0
shift_deg = 5.0
shift_period_s = 300.0

[tide]
enabled = true
range_m = 2.5
period_h = 12.42
flood_set_deg = 270.0
max_rate_kn = 1.5

# Approximate, illustrative soundings (metres below chart datum): NOT for navigation.
[bathymetry]
neighbours = 4
soundings = [
  { lat = 1.2950, lon = 103.9000, depth = 6.0 },
  { lat = 1.2800, lon = 103.9000, depth = 14.0 },
  { lat = 1.2600, lon = 103.9300, depth = 22.0 },
  { lat = 1.2950, lon = 103.9600, depth = 8.0 },
  { lat = 1.2750, lon = 103.9600, depth = 18.0 },
  { lat = 1.2500, lon = 103.9700, depth = 28.0 },
  { lat = 1.3000, lon = 104.0000, depth = 9.0 },
  { lat = 1.2800, lon = 104.0100, depth = 20.0 },
  { lat = 1.2550, lon = 104.0100, depth = 32.0 },
  { lat = 1.2300, lon = 104.0000, depth = 45.0 },
  { lat = 1.2100, lon = 104.0000, depth = 60.0 },
  { lat = 1.2700, lon = 104.0600, depth = 24.0 },
  { lat = 1.2400, lon = 104.0600, depth = 40.0 },
]

# Illustrative traffic (fictitious names, MMSIs and call signs): both Strait lanes, an anchored
# bulk carrier, a bunker tanker, a ferry across the lanes and a pleasure boat.
