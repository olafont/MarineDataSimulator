[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-sensors = { path = "crates/sim-sensors" }
protocols = { path = "crates/protocols" }
transports = { path = "crates/transports" }
scenario = { path = "crates/scenario" }
engine = { path = "crates/engine" }
mcp = { path = "crates/mcp" }

anyhow = "1"
arc-swap = "1.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }  # bundled icon glyphs, same on every OS
rand = "0.10"
rand_distr = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "fs"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkers = "0.65"
serialport = { version = "4.10", default-features = false }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rfd = "0.18"
dirs = "7"
sys-locale = "0.3"

ais = "0.12"
nmea = "0.8"

[profile.dev.package."*"]
opt-level = 2
