# Release binaries for Linux, Windows and macOS, downloadable from the run's artifacts.
# Runs only when started by hand: Actions → Build → Run workflow, or `gh workflow run build.yml`.
name: Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-universal, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # eframe (window, OpenGL, keyboard) and rfd (file dialogs) on Linux.
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev

      # The map's HTTPS stack (aws-lc-sys) may need NASM on Windows.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build (Linux, Windows)
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p app -p cli

      - name: Package (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          DIR="marine-data-simulator-$VERSION-${{ matrix.name }}"
          EXT=""; [ "$RUNNER_OS" = Windows ] && EXT=".exe"
          mkdir -p "dist/$DIR"
          cp "target/release/marine-sim$EXT" "target/release/marine-sim-cli$EXT" "dist/$DIR/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md docs/USER_MANUAL.md "dist/$DIR/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$DIR.zip" "$DIR" >/dev/null; else tar czf "$DIR.tar.gz" "$DIR"; fi
          rm -rf "$DIR"

      # Universal "Marine Data Simulator.app" in a DMG.
      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/build-macos-app.sh --universal
          mkdir -p dist && cp target/macos/*.dmg dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
